name: Release

# ─── Triggered on version tags (v1.0.0, v1.1.0, ...) ──────────────────────────
# Builds a signed Flutter release APK/AAB and drafts a GitHub Release with
# auto-generated notes. Does NOT deploy — that's still a manual deploy.yml
# dispatch, deliberately decoupled from "a version was tagged."

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:

  build-release-apk:
    name: Build signed release APK/AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: civic-platform/flutter_app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.0"
          channel: stable
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/civic-release.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=civic-release.jks
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB (for Play Store)
        run: flutter build appbundle --release

      - name: Clean up signing secrets
        if: always()
        run: rm -f android/app/civic-release.jks android/key.properties

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: civic-app-release
          path: |
            civic-platform/flutter_app/build/app/outputs/flutter-apk/app-release.apk
            civic-platform/flutter_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 90

  draft-release:
    name: Draft GitHub Release
    runs-on: ubuntu-latest
    needs: [build-release-apk]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for changelog generation

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: civic-app-release
          path: ./release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release-artifacts/flutter-apk/app-release.apk
            release-artifacts/bundle/release/app-release.aab
          body: |
            ## Smart Civic Intelligence Platform — ${{ github.ref_name }}

            Backend image: `ghcr.io/${{ github.repository_owner }}/civic-api:${{ github.sha }}`
            Dashboard image: `ghcr.io/${{ github.repository_owner }}/civic-dashboard:${{ github.sha }}`

            To deploy this release, run:
            ```
            gh workflow run deploy.yml -f environment=production -f image_tag=${{ github.sha }}
            ```

            ---
