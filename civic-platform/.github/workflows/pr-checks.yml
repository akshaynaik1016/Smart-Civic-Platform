name: PR Checks

# ─── Lightweight hygiene checks that run on every pull request ───────────────
# These are fast (seconds, no service containers) so they give immediate
# feedback before the heavier backend-ci/dashboard-ci suites even start.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:

  # ── Conventional commit PR title ─────────────────────────────────────────────
  title-lint:
    name: PR title follows Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$   # lowercase first letter, e.g. "feat: add ward filter"

  # ── Auto-label by changed path ───────────────────────────────────────────────
  label:
    name: Label by changed files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml

  # ── PR size label (helps reviewers triage) ───────────────────────────────────
  size-label:
    name: Label PR size
    runs-on: ubuntu-latest
    steps:
      - uses: codelytv/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: "size/XS"
          xs_max_size: 10
          s_label: "size/S"
          s_max_size: 100
          m_label: "size/M"
          m_max_size: 500
          l_label: "size/L"
          l_max_size: 1000
          xl_label: "size/XL"
          fail_if_xl: false

  # ── Block merge if PR targets main directly from a fork without review ──────
  check-base-branch:
    name: Verify target branch
    runs-on: ubuntu-latest
    steps:
      - name: Warn on direct-to-main PRs from feature branches
        if: github.event.pull_request.base.ref == 'main' && !startsWith(github.event.pull_request.head.ref, 'release/')
        run: |
          echo "::warning::This PR targets 'main' directly. Confirm this is intentional — most feature work should target 'develop'."
