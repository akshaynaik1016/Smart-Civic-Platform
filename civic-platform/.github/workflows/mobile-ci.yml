name: Mobile CI

# ─── Smart Civic Intelligence Platform — Flutter Citizen App ──────────────────

on:
  push:
    branches: [main, develop]
    paths:
      - "civic-platform/flutter_app/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "civic-platform/flutter_app/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: civic-platform/flutter_app

env:
  FLUTTER_VERSION: "3.19.0"

jobs:

  analyze:
    name: Analyze (flutter analyze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true   # advisory until the full codebase is formatted

      - name: Analyze
        run: flutter analyze --no-fatal-infos

  test:
    name: Unit + widget tests
    runs-on: ubuntu-latest
    needs: [analyze]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage
        continue-on-error: true   # test/ dir may be sparse this early in the build

      - name: Upload coverage
        if: hashFiles('civic-platform/flutter_app/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: civic-platform/flutter_app/coverage/lcov.info
          flags: mobile
          fail_ci_if_error: false

  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: [test]
    # Build artifact only — release signing/Play Store upload happens in
    # release.yml, gated on a version tag, not on every push.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Get dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: civic-app-debug-apk
          path: civic-platform/flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
