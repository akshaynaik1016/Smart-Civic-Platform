name: Dashboard CI

# ─── Smart Civic Intelligence Platform — React Admin Dashboard ────────────────

on:
  push:
    branches: [main, develop]
    paths:
      - "civic-dashboard/**"
      - ".github/workflows/dashboard-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "civic-dashboard/**"
      - ".github/workflows/dashboard-ci.yml"
  workflow_dispatch:

concurrency:
  group: dashboard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: civic-dashboard

env:
  NODE_VERSION: "20"

jobs:

  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: civic-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

  typecheck:
    name: Type check (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: civic-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: tsc --noEmit
        run: npx tsc --noEmit

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: civic-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build (Vite)
        run: npm run build
        env:
          VITE_API_URL: /api/v1

      - name: Check bundle size
        run: |
          SIZE_KB=$(du -sk dist | cut -f1)
          echo "Bundle size: ${SIZE_KB} KB"
          echo "bundle_size_kb=${SIZE_KB}" >> "$GITHUB_ENV"
          if [ "$SIZE_KB" -gt 5000 ]; then
            echo "::warning::Dashboard bundle exceeds 5MB (${SIZE_KB}KB) — consider code-splitting."
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: civic-dashboard/dist
          retention-days: 7

  npm-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: civic-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true   # advisory — surfaces in logs without blocking merge
