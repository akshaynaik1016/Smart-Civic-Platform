# ─── Smart Civic Intelligence Platform — Edge Reverse Proxy ──────────────────
# Routes:
#   /api/v1/*   → FastAPI backend  (api:8000)
#   /docs, /redoc, /openapi.json → backend Swagger/ReDoc
#   /metrics    → backend Prometheus exporter (internal network only)
#   /           → React dashboard (dashboard:80)
#
# Handles TLS termination in production; HTTP-only in local dev (see
# docker-compose.override.yml which skips this proxy entirely for `make dev`).

upstream civic_api {
    server api:8000 max_fails=3 fail_timeout=30s;
}

upstream civic_dashboard {
    server dashboard:80 max_fails=3 fail_timeout=30s;
}

# ── Rate limiting zones ────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_general:10m  rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m     rate=2r/s;

# ── HTTP → HTTPS redirect (production only — disabled via env in dev) ─────
server {
    listen 80;
    server_name smartcivic.gov.in www.smartcivic.gov.in;

    # ACME challenge for Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name smartcivic.gov.in www.smartcivic.gov.in;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 12M;   # matches MAX_UPLOAD_SIZE_MB + headroom

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ── API routes ────────────────────────────────────────────────────────
    location /api/v1/auth/ {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass http://civic_api;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/v1/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://civic_api;
        include /etc/nginx/proxy_params.conf;
    }

    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://civic_api;
        include /etc/nginx/proxy_params.conf;
    }

    location = /health {
        proxy_pass http://civic_api/health;
        include /etc/nginx/proxy_params.conf;
    }

    # Prometheus metrics — restrict to internal/VPN ranges in production
    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://civic_api/metrics;
        include /etc/nginx/proxy_params.conf;
    }

    # ── Dashboard (SPA) ──────────────────────────────────────────────────
    location / {
        proxy_pass http://civic_dashboard;
        include /etc/nginx/proxy_params.conf;
    }
}
