# ─── PostgreSQL configuration — Smart Civic Intelligence Platform ────────────
# Tuned for a small-to-medium municipal deployment (4 vCPU / 4-8GB container).
# Adjust shared_buffers / effective_cache_size if the host has more RAM.

listen_addresses = '*'
max_connections = 100

# ── Memory ────────────────────────────────────────────────────────────────
shared_buffers          = 1GB
effective_cache_size    = 3GB
maintenance_work_mem     = 256MB
work_mem                 = 16MB

# ── Write-ahead log ──────────────────────────────────────────────────────
wal_level                = replica
max_wal_size              = 2GB
min_wal_size              = 512MB
checkpoint_completion_target = 0.9

# ── Query planner ─────────────────────────────────────────────────────────
random_page_cost         = 1.1        # SSD-appropriate
effective_io_concurrency = 200

# ── PostGIS / spatial queries ────────────────────────────────────────────
shared_preload_libraries = 'pg_stat_statements'

# ── Logging ───────────────────────────────────────────────────────────────
log_destination          = 'stderr'
logging_collector         = on
log_min_duration_statement = 500       # log queries slower than 500ms
log_checkpoints           = on
log_connections            = off
log_disconnections         = off
log_lock_waits             = on
log_temp_files              = 0
log_autovacuum_min_duration = 0

# ── Autovacuum (important for the high-write complaints/audit_logs tables) ─
autovacuum                       = on
autovacuum_max_workers           = 3
autovacuum_naptime               = 30s
autovacuum_vacuum_scale_factor   = 0.1
autovacuum_analyze_scale_factor  = 0.05

# ── Timezone ──────────────────────────────────────────────────────────────
timezone = 'Asia/Kolkata'
