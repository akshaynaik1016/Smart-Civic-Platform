[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "smart-civic-api"
version = "1.0.0"
description = "Smart Civic Intelligence Platform — FastAPI Backend"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "gunicorn==22.0.0",

    # Database
    "sqlalchemy[asyncio]==2.0.30",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "psycopg2-binary==2.9.9",

    # Cache
    "redis[hiredis]==5.0.4",

    # Auth & Security
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.9",
    "cryptography==42.0.5",

    # Validation
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "email-validator==2.1.1",
    "phonenumbers==8.13.35",

    # S3 / Storage
    "boto3==1.34.98",
    "aioboto3==13.0.0",
    "Pillow==10.3.0",
    "python-magic==0.4.27",

    # AI / ML
    "ultralytics==8.2.18",
    "opencv-python-headless==4.9.0.80",
    "torch==2.3.0",
    "torchvision==0.18.0",
    "numpy==1.26.4",
    "imagehash==4.3.1",

    # Background tasks
    "celery[redis]==5.4.0",
    "flower==2.0.1",

    # Firebase
    "firebase-admin==6.5.0",

    # HTTP client
    "httpx==0.27.0",
    "aiohttp==3.9.5",

    # Utilities
    "python-dotenv==1.0.1",
    "tenacity==8.3.0",
    "structlog==24.1.0",
    "sentry-sdk[fastapi]==1.45.0",
    "geopy==2.4.1",
    "shapely==2.0.4",
    "pyproj==3.6.1",
    "pendulum==3.0.0",
    "orjson==3.10.3",
    "slowapi==0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "factory-boy==3.3.0",
    "faker==25.0.1",
    "black==24.4.2",
    "ruff==0.4.4",
    "mypy==1.10.0",
]
