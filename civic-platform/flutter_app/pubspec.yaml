name: smart_civic
description: Smart Civic Intelligence Platform — Citizen Mobile App
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Navigation
  go_router: ^13.2.0

  # Networking
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1
  connectivity_plus: ^6.0.3

  # Local storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3
  hive_flutter: ^1.1.0

  # Camera & image
  camera: ^0.10.5+9
  image_picker: ^1.1.2
  image_cropper: ^7.0.3
  cached_network_image: ^3.3.1
  flutter_image_compress: ^2.3.0

  # Maps
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  flutter_polyline_points: ^2.0.0

  # Firebase
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.2
  firebase_analytics: ^11.1.0

  # UI components
  material_design_icons_flutter: ^7.0.7296
  flutter_svg: ^2.0.10
  lottie: ^3.1.0
  shimmer: ^3.0.0
  badges: ^3.1.2
  percent_indicator: ^4.2.3
  fl_chart: ^0.67.0
  timeline_tile: ^2.0.0
  expandable: ^5.0.1
  pinput: ^5.0.0

  # Utilities
  intl: ^0.20.2
  timeago: ^3.6.1
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  package_info_plus: ^8.0.0
  device_info_plus: ^10.1.0
  permission_handler: ^11.3.1
  uuid: ^4.4.0
  crypto: ^3.0.3
  path_provider: ^2.1.3
  open_file: ^3.3.2

  # Forms & validation
  reactive_forms: ^17.0.1
  form_validator: ^2.1.1

  # Notifications
  flutter_local_notifications: ^17.2.1+2

  # Code scanning
  mobile_scanner: ^5.1.1
  get_it: ^9.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/
  fonts:
  - family: Poppins
    fonts:
      - asset: assets/fonts/Poppins-Regular.ttf

      - asset: assets/fonts/Poppins-Medium.ttf
        weight: 500

      - asset: assets/fonts/Poppins-SemiBold.ttf
        weight: 600

      - asset: assets/fonts/Poppins-Bold.ttf
        weight: 700